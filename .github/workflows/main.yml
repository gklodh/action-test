name: My first action

on:
  push: 
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - run: "docker build -t colour ."
  security_scan:
    runs-on: ubuntu-22.04
    steps:
      - run: "trivy image --scanners vuln --severity HIGH,MEDIUM,CRITICAL -format table | tee color.txt"
  deploy:
    runs-on: ubuntu-22.04
    needs: [build, security_scan]
    steps:
      - run: "docker run -d --name test -p 5000:8000 colorb color"
      
