# /etc/nginx/sites-available/colorburst
# sudo ln -s /etc/nginx/sites-available/colorburst /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name your-domain.com;   # <-- change to your domain or server IP

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # optional: serve static files directly (faster)
    location /static/ {
        alias /var/www/colorburst/static/;
        expires 30d;
    }
}
